# Publish the landing page (site/) to GitHub Pages on every push to main.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/i18n/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The English and Turkish pages are generated from the Persian one;
      # fail if someone edited site/index.html without rebuilding them.
      - name: Check translations are up to date
        run: |
          python3 tools/i18n/build.py
          git diff --exit-code -- site/en site/tr

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
